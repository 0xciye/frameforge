name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenCV runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgl1 \
            libglib2.0-0 \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            wget

      - name: Install Rust stable and rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Install engine test dependencies
        run: python -m pip install -e "engine[dev]"

      - name: Run engine tests
        run: python -m pytest engine/tests -q

      - name: Prepare packaged engine resource path for Rust checks
        run: python -c "from pathlib import Path; Path('engine/dist').mkdir(parents=True, exist_ok=True)"

      - name: Install self-contained runtime dependencies
        if: runner.os == 'macOS' || runner.os == 'Windows'
        run: python -m pip install -e "engine[package,train]"

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Compile Tauri application
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

      - name: Build portable macOS or Windows app
        if: runner.os == 'macOS' || runner.os == 'Windows'
        run: pnpm build:portable

      - name: Verify packaged engine in macOS app bundle
        if: runner.os == 'macOS'
        run: >-
          python scripts/package_engine.py --smoke-only
          "src-tauri/target/release/bundle/macos/FrameForge.app/Contents/Resources/engine-runtime/frameforge-engine/frameforge-engine"

      - name: Verify packaged engine in Windows app folder
        if: runner.os == 'Windows'
        run: >-
          python scripts/package_engine.py --smoke-only
          "src-tauri/target/release/FrameForge/engine-runtime/frameforge-engine/frameforge-engine.exe"
