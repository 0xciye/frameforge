name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenCV runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgl1 \
            libglib2.0-0 \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            wget

      - name: Install Rust stable and rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Install engine test dependencies
        run: python -m pip install -e "engine[dev]"

      - name: Run engine tests
        run: python -m pytest engine/tests -q

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Compile Tauri application
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

      - name: Build macOS application bundle
        if: runner.os == 'macOS'
        run: pnpm tauri build --bundles app

      - name: Build Windows MSI
        if: runner.os == 'Windows'
        run: pnpm tauri build --bundles msi
